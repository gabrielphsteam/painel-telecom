name: Movimento massivo e área de risco
on:
  push:
    paths: ['atividades.csv']
  workflow_dispatch:
concurrency:
  group: movimento
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  movimento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/movimento.py
      - name: Publica movimento.json
        run: |
          git config user.name "movimento-bot"
          git config user.email "movimento-bot@users.noreply.github.com"
          git add movimento.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Movimento massivo/risco ($(date -u +%H:%M) UTC)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 3; done
          exit 1
